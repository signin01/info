version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: innspark-mysql
    restart: always
    environment:
      MYSQL_DATABASE: login_monitor
      MYSQL_ROOT_PASSWORD: Kumar@008
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: innspark-monitor-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/login_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Kumar@008
    ports:
      - "8080:8080"

volumes:
  mysql_data:
