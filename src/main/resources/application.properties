# Server Configuration (dynamic port for cloud providers like Render / Railway)
server.port=${PORT:8080}

# Database Configuration (Uses SPRING_DATASOURCE_URL if provided, else embedded database for 1-click cloud zero-config)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/login_monitor;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate (Dialect auto-detected dynamically by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret Key (change this to a strong random string in production)
jwt.secret=InnSparkLoginMonitorSuperSecretKey2024XYZ123456789ABCDEF
jwt.expiration=86400000

# Email Configuration (Gmail SMTP - update with your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin email for suspicious activity notifications
app.admin.email=admin@innspark.com

# Rate Limiting Configuration
app.rate-limit.max-attempts=5
app.rate-limit.window-minutes=1

# Detection Logic Configuration
app.detection.brute-force-threshold=5
app.detection.window-minutes=10
app.detection.unusual-success-threshold=3

# Session Configuration
app.session.expiry-minutes=15

# Google reCAPTCHA (optional - get keys from https://www.google.com/recaptcha)
app.captcha.secret-key=YOUR_RECAPTCHA_SECRET_KEY
app.captcha.site-key=YOUR_RECAPTCHA_SITE_KEY
app.captcha.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.innspark=DEBUG
